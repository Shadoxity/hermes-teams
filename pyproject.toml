[project]
name = "hermes-teams"
version = "0.1.0"
description = "External Microsoft Teams platform plugin for Hermes Agent"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "aiohttp>=3.9,<4", "microsoft-teams-apps==2.0.13.4"]

[dependency-groups]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["hermes: requires the actual supported Hermes source/runtime"]
